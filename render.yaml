services:
  - type: web
    name: regale-hotels-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: CORS_ORIGINS
        sync: false
      - key: PENDING_PAYMENT_EXPIRY_MINUTES
        value: "15"
      - key: COOKIE_SECURE
        value: "true"
      - key: PAYMENTS_STUB_MODE
        value: "true"
